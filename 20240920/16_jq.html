<html lang="en">

</head>
<body>
    <h1 id="one">lorem1</h1>
    <h1 id="two">lorem2</h1>

    <script>
        //one,three가 jQuery 적용

        //jQuery의 핵심 $

        $('#one').css('background-color','yellow').css('color','blue')

        four.style.color = 'hotpink'

    </script>
