<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #container{
            display: grid;
            gap:10px;
            /* 가로 3칸, 칸 별 픽셀 사이즈 지정 */
            grid-template-columns: 200px 400px 200px;
            /* 세로 2칸에 대하여 픽셀 사이즈 지정 */
            grid-template-rows: 200px 200px;
        }
        #container>div{
            border: 1px solid black;
            background-color: blueviolet;
        }
    </style>
</head>
<body>
    <div id="container">
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
    </div>
</body>
</html>
