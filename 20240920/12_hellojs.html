<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        //javaScript != java
        //세미콜론 생략 가능
        console.log('Hello World') //문자열 : 작은 따옴표 써도 됨
        console.log("안녕하세요") //큰따옴표 써도 됨
        alert('Hello World')//화면에 뜨는 경고창
        //변수 = 무언가를 저장하고 관리하는 문자
        //변수 : 다른 언어에서는 정수형 변수, 실수형 변수를 구분
        //파이썬이나 js는 구분하지 않음
        
        var a = 1 //변수키워드 변수이름 = 값   이렇게 적는 걸 '선언'
        a="안녕하세요" //대입을 통하여 값 변경 가능
        let b = 10
        b = "Hello"
        alert(a)
        alert(b)
        const c = 'Hello World!!!' //상수, 값이 선언되고 변하지 않을 경우 사용

        //var이 let보다 옛날에(먼저) 나온 키워드
        //var과 let의 가장 큰 차이
        //var은 중복해서 변수 선언을 허용
        //let은 중복해서 변수 선언을 허용하지 않음
        var ex1 = '안녕'
        var ex1 = 123 //별도의 오류 없이 그냥 실행됨
        console.log(ex1)
        //let ex2 = 'hey'
        //let ex2 = 'hi'

     </script>
</body>
</html>
